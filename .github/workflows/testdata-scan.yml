# `cargo xtask ci testdata-scan --in pr` (design 5.1.6): the test ID registry and the personal data scans.
# On every PR and every push to main, as one of `ci pr`'s jobs.
name: testdata-scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  testdata-scan:
    uses: ./.github/workflows/xtask.yml
    with:
      job: testdata-scan
      runner: ubuntu-24.04
      within: pr
      timeout: 30
