# The e2e tests a spec and a name match, each run N times in one call on an
# e2e build of the commit (T197): for the runs a flaky test needs, with nobody
# at the machine (T189, D6). As in `xtask ci e2e`, the tests tagged `@focus`
# run after the rest, one at a time, so that a whole spec runs at CI's
# parallelism (T099). Busy processes can slow the tests down: M1a's exit runs
# nfr1 with half the runner's cores taken (T099).
name: e2e-repeat

on:
  workflow_dispatch:
    inputs:
      spec:
        description: The spec, from tools/e2e (a pattern of its path)
        default: src/security.spec.ts
      test:
        description: The test's name, or the start of it
        default: E2E-SEC-real-input
      times:
        description: How many times
        default: "50"
      workers:
        description: >-
          How many copies at once of the tests not tagged @focus; 2 is the load
          of `xtask ci e2e` (T208). Those tagged @focus run one at a time
        default: "1"
      load:
        description: >-
          How many busy processes run alongside the tests; 2 is half the
          runner's 3 cores, rounded up (T099)
        default: "0"

permissions:
  contents: read

jobs:
  repeat:
    name: ${{ inputs.test }} × ${{ inputs.times }}, ${{ inputs.workers }} at once, load ${{ inputs.load }} (macos-15)
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: e2e
      - name: Build
        run: |
          pnpm install --frozen-lockfile
          cargo xtask runtime-pack
          cargo build --locked -p cupper-fake-agent
          pnpm build:e2e
      - name: Run
        env:
          SPEC: ${{ inputs.spec }}
          TEST: ${{ inputs.test }}
          TIMES: ${{ inputs.times }}
          WORKERS: ${{ inputs.workers }}
          LOAD: ${{ inputs.load }}
        run: |
          # A failed run must not end the script before the next one.
          set +e -u
          for ((i = 0; i < LOAD; i++)); do yes > /dev/null & done
          echo "$LOAD busy processes on $(sysctl -n hw.ncpu) cores"
          # One Playwright run, with a report and a folder of its own: a run
          # empties its folder when it starts (T212).
          run() {
            PLAYWRIGHT_JSON_OUTPUT_FILE="$GITHUB_WORKSPACE/repeat-$1.json" \
              pnpm --filter @cupper/e2e run test:e2e:one "$SPEC" "${@:2}" \
              --output="dist/test-results/$1" --repeat-each="$TIMES" \
              --reporter=list,json --pass-with-no-tests
          }
          run rest -g "$TEST" --grep-invert @focus --workers="$WORKERS"
          rest=$?
          run focus -g "(?=.*@focus)(?=.*$TEST)" --workers=1
          focus=$?
          uptime
          busy=$(jobs -p)
          [ -z "$busy" ] || kill $busy
          [ "$rest" -eq 0 ] && [ "$focus" -eq 0 ]
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-repeat
          path: |
            repeat-rest.json
            repeat-focus.json
            tools/e2e/dist/test-results/
          retention-days: 14
          if-no-files-found: ignore
      - name: runtime-pack's stage out of the caches
        if: always()
        # Of target/runtime-pack only the downloads are cached (see setup).
        run: >-
          [ ! -d target/runtime-pack ] ||
          find target/runtime-pack -mindepth 1 -maxdepth 1 ! -name downloads -exec rm -rf {} +
