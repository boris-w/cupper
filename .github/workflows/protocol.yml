# `cargo xtask ci protocol --in pr` (design 5.1.6): the generated schema and TS, schema compatibility and the views.
# On every PR and every push to main, as one of `ci pr`'s jobs.
name: protocol

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  protocol:
    uses: ./.github/workflows/xtask.yml
    with:
      job: protocol
      runner: ubuntu-24.04
      within: pr
      timeout: 30
