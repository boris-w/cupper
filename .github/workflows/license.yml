# `cargo xtask ci license --in pr` (design 5.1.6): cargo deny and the license gate's first layer.
# On every PR and every push to main, as one of `ci pr`'s jobs.
name: license

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  license:
    uses: ./.github/workflows/xtask.yml
    with:
      job: license
      runner: ubuntu-24.04
      within: pr
      timeout: 30
