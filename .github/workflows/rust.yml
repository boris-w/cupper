# `cargo xtask ci rust --in pr` (design 5.1.6): fmt, clippy, the tests of every feature set and the golden tests.
# On every PR and every push to main, as one of `ci pr`'s jobs.
name: rust

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    uses: ./.github/workflows/xtask.yml
    with:
      job: rust
      runner: macos-15
      within: pr
      timeout: 120
