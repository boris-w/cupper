# `cargo xtask ci security-peer` (design 5.1.6, Q24) on macOS 26 for a PR
# that changes cupper-sys (every PR's `rust` job runs its tests on macOS 15);
# every night it runs on macOS 15 and 26 (nightly.yml).
name: cupper-sys

on:
  pull_request:
    paths:
      - "crates/cupper-sys/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-peer:
    name: security-peer (macos-26)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/xtask
        with:
          job: security-peer
          runner: macos-26
