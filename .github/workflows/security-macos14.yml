# `cargo xtask ci security-macos14` (design 5.1.6, Q24) on macOS 14, for a PR
# that changes cupper-sys; every night it runs on macOS 14 and 15 (nightly.yml).
name: security-macos14

on:
  pull_request:
    paths:
      - "crates/cupper-sys/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-macos14:
    uses: ./.github/workflows/xtask.yml
    with:
      job: security-macos14
      runner: macos-14
      timeout: 45
