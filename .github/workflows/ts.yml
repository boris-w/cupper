# `cargo xtask ci ts --in pr` (design 5.1.6): prettier, ESLint, tsc and Vitest.
# On every PR and every push to main, as one of `ci pr`'s jobs.
name: ts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ts:
    uses: ./.github/workflows/xtask.yml
    with:
      job: ts
      runner: ubuntu-24.04
      within: pr
      timeout: 30
