# `cargo xtask ci ui --in pr` (design 5.1.6): the screenshot regression, when a change touches what it shows.
# On every PR and every push to main, as one of `ci pr`'s jobs.
name: ui

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ui:
    uses: ./.github/workflows/xtask.yml
    with:
      job: ui
      runner: macos-15
      within: pr
      timeout: 45
