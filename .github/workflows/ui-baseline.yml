# The screenshot baselines, made on the runner the `ui` job compares on
# (design 5.1.6: only a CI workflow makes them). The result is an artifact;
# baselines reach the repository through a PR like any change (T197).
# Playwright rewrites only the shots past its pixel threshold; `all` rewrites
# every one, for a change the threshold does not see (T152).
name: ui-baseline

on:
  workflow_dispatch:
    inputs:
      all:
        description: Rewrite every baseline, not only those past the pixel threshold
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  baselines:
    name: baselines (macos-15)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: ui
      - name: Make the baselines
        env:
          UPDATE: ${{ inputs.all && 'all' || 'changed' }}
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir tools/ui-screenshots exec playwright install chromium
          CUPPER_UI_BASELINE=1 pnpm --dir tools/ui-screenshots exec playwright test --update-snapshots="$UPDATE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-baselines
          path: tools/ui-screenshots/baselines/
