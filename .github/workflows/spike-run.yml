# A spike's command on a GitHub-hosted macOS runner, its results kept as an
# artifact (SP-6 on the runner, docs/meetings/2026-11-03-sp6-runner/; T104,
# and T103 and T108 after it). The command runs in the spike's directory
# after the workspace's install; whatever it writes under `results/` there
# is uploaded. Manual, recorded only: nothing here judges a number.
name: spike-run

on:
  workflow_dispatch:
    inputs:
      dir:
        description: The spike's directory, under spikes/ (e.g. spikes/T104-review-iframe)
        required: true
      command:
        description: The command, run with bash in that directory
        required: true
      minutes:
        description: The job's time limit in minutes, 1 to 360 (a soak takes close to 360)
        default: "60"

permissions:
  contents: read

jobs:
  run:
    name: ${{ inputs.dir }} (macos-15)
    runs-on: macos-15
    timeout-minutes: ${{ fromJSON(inputs.minutes) > 360 && 360 || fromJSON(inputs.minutes) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The inputs reach the shell only through the environment.
      - name: Inputs
        id: inputs
        env:
          DIR: ${{ inputs.dir }}
          MINUTES: ${{ inputs.minutes }}
        run: |
          case "$DIR" in
            spikes/*) ;;
            *) echo "::error::dir must be under spikes/"; exit 1 ;;
          esac
          case "$DIR" in
            *..*) echo "::error::dir must not contain .."; exit 1 ;;
          esac
          [ -d "$DIR" ] || { echo "::error::no directory $DIR"; exit 1; }
          [[ "$MINUTES" =~ ^[0-9]+$ ]] && ((MINUTES >= 1 && MINUTES <= 360)) ||
            { echo "::error::minutes must be 1 to 360"; exit 1; }
      - uses: ./.github/actions/setup
        with:
          cache-key: spike
      - name: Workspace
        run: pnpm install --frozen-lockfile
      - name: Run
        env:
          DIR: ${{ inputs.dir }}
          COMMAND: ${{ inputs.command }}
        run: |
          cd "$DIR"
          bash -c "$COMMAND"
      # Only a checked directory names the artifact's path.
      - if: always() && steps.inputs.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spike-results
          path: ${{ inputs.dir }}/results/
          retention-days: 14
          if-no-files-found: warn
      # A spike on an e2e build stages the runtime; as in e2e-repeat, only the
      # downloads may stay in the caches (ADR-11).
      - name: runtime-pack's stage out of the caches
        if: always()
        run: >-
          [ ! -d target/runtime-pack ] ||
          find target/runtime-pack -mindepth 1 -maxdepth 1 ! -name downloads -exec rm -rf {} +
