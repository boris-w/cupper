# What every CI job needs after the checkout (design 5.1.6, T197): `main`
# for the jobs that compare with it, Node and the pnpm package.json pins,
# and the caches: cargo's registry and target, pnpm's store, and the
# downloads of runtime-pack and git-lfs. Rust is rust-toolchain.toml's,
# which rustup installs on first use.
name: setup
description: The checkout's main, Node and pnpm, and the caches

inputs:
  cache-key:
    description: What the cargo target cache is kept per, as a job name
    required: true

runs:
  using: composite
  steps:
    # A PR checks out a merge commit with only origin/main: `ci pr` and
    # `--in pr` compare the change with `main`. A shallow checkout has neither.
    - name: main
      shell: bash
      run: |
        if ! git show-ref --verify --quiet refs/heads/main \
          && git show-ref --verify --quiet refs/remotes/origin/main; then
          git branch main origin/main
        fi
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .node-version
        package-manager-cache: false
    - name: pnpm
      id: pnpm
      shell: bash
      run: |
        npm install --global "$(node -p 'require("./package.json").packageManager')"
        echo "store=$(pnpm store path)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm.outputs.store }}
        key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: pnpm-${{ runner.os }}-
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        key: ${{ inputs.cache-key }}
    # After rust-cache, so that these are saved before it cleans the target
    # dir. The claude-agent-acp bundle's isolated dir, which holds Anthropic's
    # SDK, is in no cache (ADR-11).
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          target/runtime-pack/downloads
          target/git-lfs
        key: downloads-${{ runner.os }}-${{ hashFiles('runtime/manifest.json', 'crates/xtask/src/git_lfs.rs') }}
