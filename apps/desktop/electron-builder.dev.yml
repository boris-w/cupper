# The dev build (design 5.7.9): its own identity and data directory, signed
# ad hoc, fuses left as Electron ships them.
appId: dev.cupper.app.dev
productName: cupper Dev
directories:
  output: dist/pack/dev
files:
  - package.json
  - dist/main/**
  - dist/preload/**
  - dist/renderer/**
npmRebuild: false
# The native extension, outside the asar, and the host bundle in Helpers
# (design 5.10.1); `build:dev` builds both first.
extraResources:
  - from: ../../target/host-bundle/build/release/libcupper_native.dylib
    to: native/cupper_native.node
extraFiles:
  - from: ../../target/host-bundle/dev/CupperHost.app
    to: Helpers/CupperHost.app
mac:
  # `host-bundle` signed it; signing it again would change its cdhash.
  signIgnore: ["CupperHost\\.app"]
  target: dir
  identity: "-"
  hardenedRuntime: false
  minimumSystemVersion: "14.0"
