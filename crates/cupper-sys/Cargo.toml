[package]
name = "cupper-sys"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "macOS system interfaces for cupper; the only crate with `unsafe` (design 5.1.1)."

[features]
# Helpers for other crates' tests, such as `send_with_fds`; never in a product build.
test-util = []

[dependencies]
core-foundation = "0.10.1"
libc = "0.2.191"
# AppKit's loop on the host's main thread, LaunchServices through
# NSWorkspace, and UserNotifications (design 5.2.3, 5.2.9). Exact releases
# (design 5.1.7); MIT, and Zlib OR Apache-2.0 OR MIT for the framework crates
# (ADR-11).
block2 = "=0.6.2"
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSEvent", "NSGraphicsContext", "NSResponder", "NSRunningApplication", "NSWorkspace"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSAppleEventDescriptor", "NSAppleEventManager", "NSArray", "NSBundle", "NSEnumerator", "NSError", "NSGeometry", "NSLocale", "NSNotification", "NSString", "NSURL"] }
objc2-user-notifications = { version = "=0.3.2", default-features = false, features = ["std", "block2", "UNNotificationContent", "UNNotificationRequest", "UNNotificationSettings", "UNNotificationSound", "UNNotificationTrigger", "UNUserNotificationCenter"] }
thiserror = "2.0.21"

# The main loop runs on the main thread, which libtest's threads are not;
# the quit Apple Event comes from `test-util`.
[[test]]
name = "runloop"
harness = false
required-features = ["test-util"]

[lints]
workspace = true
