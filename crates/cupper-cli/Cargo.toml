[package]
name = "cupper-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "cupper's command-line client: the `cupper` binary and the library the host's integration tests reuse (design 5.2.14)."

# The build kind comes from these features (design 5.7.9, 5.8.1); none is the
# release build. They never mix in one release binary: each binary is built on
# its own (design 5.10.7).
[features]
# Development builds: accept a host in degraded authentication, checked weakly
# against the host file next to the CLI.
dev-auth = []
# Self-use builds: check the host against the cdhash that `xtask host-bundle`
# (T005) passes in `CUPPER_HOST_CDHASH` when it compiles the CLI.
self-use = []
# e2e builds: `--harness-key-fd` and the `harness` proof (design 5.8.1).
test-harness = ["dep:getrandom"]

[[bin]]
name = "cupper"
path = "src/main.rs"

# IT-elevate's probe (design 5.8.4); test builds only, never in a release.
[[bin]]
name = "cupper-elevate-probe"
path = "src/bin/elevate_probe.rs"
required-features = ["test-harness"]

[dependencies]
cupper-protocol = { path = "../cupper-protocol" }
cupper-sys = { path = "../cupper-sys" }
# The client nonce of the `harness` proof.
getrandom = { version = "0.4.3", optional = true }
serde_json.workspace = true
thiserror.workspace = true
# `time` is unused, but without it clippy's `disallowed-methods` entries for
# tokio's timers do not resolve when this crate is linted on its own.
# `io-std`: `repl` reads its commands from stdin.
tokio = { version = "1.53.3", features = ["io-std", "io-util", "net", "rt", "sync", "time"] }
uuid = { version = "1.28.0", default-features = false, features = ["std", "v7"] }

[dev-dependencies]
# `send_with_fds`: a host that passes fds (UNIT-cli-client).
cupper-sys = { path = "../cupper-sys", features = ["test-util"] }
tokio = { version = "1.53.3", features = ["macros"] }

[lints]
workspace = true
