[package]
name = "cupper-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The cupper session host: lib and the `cupper-host` binary (design 5.2)."

[features]
# One-time key authentication for development and e2e builds (design 5.1.3, 5.8.1).
dev-auth = []
# Test principal, test methods, injection points and failpoints (design 5.1.3, 5.9.9).
# Release builds never enable it.
test-harness = []

[dependencies]
# The ACP SDK is pinned to the exact release T003 validated (ADR-02, design 5.6.10).
# `unstable_plan_operations`: the `plan` client capability and `plan_update` (design 5.6.1).
agent-client-protocol = { version = "=3.3.0", features = ["unstable_plan_operations"] }
# The SDK only asks for ^3.3.0 of its derive macros; keep them on the same release.
agent-client-protocol-derive = "=3.3.0"
cupper-protocol = { path = "../cupper-protocol" }
cupper-sys = { path = "../cupper-sys" }
futures = { version = "0.3.34", default-features = false, features = ["std"] }
getrandom = "0.4.3"
# Exact: the bundled SQLite (3.53.2) comes with this release (design 5.1.3).
# No default features: the store does not use the statement cache (`cache`),
# and the other default only matters on wasm. `fallible_uint` binds `u64`
# (seqs, times), failing above `i64::MAX` instead of wrapping.
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "fallible_uint"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
thiserror = "2.0.21"
# `host.log` (design 5.11.1); the ACP SDK already depends on this release.
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }
# `macros`: the session actor's `select!`; `rt-multi-thread`: the host's
# workers beside the main thread's run loop; `signal`: SIGTERM starts the
# orderly exit (design 5.2.3, 5.2.13).
tokio = { version = "1.53.3", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1.28.0", default-features = false, features = ["std"] }

[dev-dependencies]
# The CLI's client, with the harness key, against the gateway fixture.
cupper-cli = { path = "../cupper-cli", features = ["test-harness"] }
# `send_with_fds`: a peer that passes fds (IT-pinned-token).
cupper-sys = { path = "../cupper-sys", features = ["test-util"] }
proptest.workspace = true
# Exact: PROP-stream-seq runs the streams under its scheduler, built with
# `--cfg shuttle` (design 5.9.8; `store::streams::sync`).
shuttle = "=0.9.7"
tokio = { version = "1.53.3", features = ["macros"] }

[[test]]
name = "migrations"
required-features = ["test-harness"]

# IT-lifecycle runs the host with a `harness_key`.
[[test]]
name = "lifecycle"
required-features = ["test-harness"]

# The gateway alone, for process-level tests (T039, T073).
[[bin]]
name = "cupper-gateway-fixture"
path = "src/bin/gateway_fixture.rs"
required-features = ["test-harness"]

# IT-devkey-launcher-only and IT-devkey-orphan-start run the fixture with `dev_key`.
[[test]]
name = "gateway"
required-features = ["dev-auth", "test-harness"]

[lints]
workspace = true
