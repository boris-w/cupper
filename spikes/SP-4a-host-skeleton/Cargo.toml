[workspace]
resolver = "3"
members = [
    "crates/cupper-protocol",
    "crates/cupper-host",
    "crates/cupper-cli",
    "crates/cupper-fake-agent",
]

[workspace.package]
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
cupper-protocol = { path = "crates/cupper-protocol" }
cupper-cli = { path = "crates/cupper-cli" }

agent-client-protocol = "=3.3.0"
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
futures = "0.3"
hex = "0.4"
libc = "0.2"
proptest = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
tokio-util = { version = "0.7", features = ["compat"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.18", features = ["v4", "v7"] }

[profile.release]
debug = false
