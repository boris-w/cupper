[package]
name = "q9-probe"
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
publish = false
description = "T003 Q9: extension messages through the ACP Rust SDK =3.3.0 against claude-agent-acp (spike, not product code)."

[dependencies]
agent-client-protocol = "=3.3.0"
anyhow = "1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
