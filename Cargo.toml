[workspace]
resolver = "3"
# New crates only add a directory under `crates/`; this file does not change.
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
# `File::try_lock` is stable since 1.89 (design 5.1.4).
rust-version = "1.89"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
anyhow = "1.0.100"
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
thiserror = "2.0.21"

[workspace.lints.rust]
# `unsafe` lives only in `cupper-sys`, which opts out with a crate-level `allow` (design 5.1.1).
unsafe_code = "deny"
# `--cfg shuttle` swaps the host streams' locks for shuttle's (PROP-stream-seq, design 5.9.8).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(shuttle)"] }

[workspace.lints.clippy]
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
