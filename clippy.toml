# Time and UUIDv7 only through `Clock` / `IdGen` (design 5.2.16). Outside the `clock`
# module, a call needs `#[expect(clippy::disallowed_methods, reason = "...")]`.
disallowed-methods = [
  { path = "std::time::Instant::now", reason = "read time through `Clock::now_mono` (design 5.2.16)" },
  { path = "std::time::Instant::elapsed", reason = "subtract `Clock::now_mono` readings (design 5.2.16)" },
  { path = "std::time::SystemTime::now", reason = "read time through `Clock::now_wall_ms` (design 5.2.16)" },
  { path = "std::time::SystemTime::elapsed", reason = "subtract `Clock::now_wall_ms` readings (design 5.2.16)" },
  { path = "std::thread::sleep", reason = "wait on a `Clock::timer_at` timer (design 5.2.16)" },
  { path = "tokio::time::Instant::now", reason = "read time through `Clock::now_mono` (design 5.2.16)" },
  { path = "tokio::time::sleep", reason = "wait on a `Clock::timer_at` timer (design 5.2.16)" },
  { path = "tokio::time::sleep_until", reason = "wait on a `Clock::timer_at` timer (design 5.2.16)" },
  { path = "tokio::time::interval", reason = "schedule through `Clock::timer_at` (design 5.2.16)" },
  { path = "tokio::time::interval_at", reason = "schedule through `Clock::timer_at` (design 5.2.16)" },
  { path = "tokio::time::timeout", reason = "race against a `Clock::timer_at` timer (design 5.2.16)" },
  { path = "tokio::time::timeout_at", reason = "race against a `Clock::timer_at` timer (design 5.2.16)" },
  { path = "uuid::Uuid::now_v7", reason = "generate UUIDv7 through `IdGen` (design 5.2.16)" },
]
