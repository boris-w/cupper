# 用例编号登记表（设计 5.9.10，计划 1.6），由 tools/trace-ids 读取：
#   check          文档（docs/03-plan.md、docs/design/）里的每个编号都在这里登记、格式正确；
#                  `cargo xtask ci testdata-scan` 运行它
#   status、verify 按测试结果和人工证据推导每个编号是否完成，待完成清单不手工维护
#
# 每个产出任务一段，按计划第 2 节任务表的顺序；任务只追加自己的一段，不删行（计划 1.5）。
# 段里的 milestone 是这一段的默认里程碑（M1a、M1b、release、M2、later），其余每个键是一个编号。
# 值是字符串时就是套件，即这个编号必须在哪个 `xtask ci` 目标里通过：
#   pr       每个 PR                      nightly  每晚
#   release  发布流水线                    compat   兼容套件（`cargo xtask compat`，维护者本机运行）
#   man      人工检查，靠证据而不是测试结果
# 需要更多字段时写成内联表：
#   suite、milestone   同上；milestone 覆盖段的默认值
#   status、reason     conditional（条件任务的编号，检查点通过后改为 na）、na（不适用）、
#                      gap（缺口：本机替代不了）、gap-confirmed（缺口，用户已确认）；都要写 reason
#   parts              子编号：全部子编号完成才算完成
#   versions           MAN：证据要与这些组件的当前版本相符，如 { electron = "major" }
#   max_age_days       MAN：证据超过这么多天就过期
# 没有产出任务的编号放在 [unplanned]；文档里形似编号、但不是用例编号的写法放在 [not-ids]；
# MAN 的证据追加在文件末尾：
#   [[evidence]]
#   id = "MAN-keyboard"
#   date = "YYYY-MM-DD"
#   record = "docs/tasks/<ID>-<slug>/<记录>.md"
#   versions = { electron = "44.9.0" }

